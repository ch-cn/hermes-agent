name: Build Hermes Desktop (Windows)

on:
  workflow_dispatch:        # 去 GitHub Actions 页手动点 “Run workflow”
  push:
    branches: [desktop-build]

jobs:
  build-desktop-win:
    runs-on: windows-latest   # GitHub 的 Windows 官方便携 runner，无需 wine
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pin npm 12.0.2
        run: npm install -g npm@12.0.2

      - name: Install workspace dependencies (root)
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npm run dist:win

      - name: Inspect build output (找找 exe 在哪)
        working-directory: apps/desktop
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: hermes-desktop-win
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 30
